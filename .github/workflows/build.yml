name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: |
          mkdir -p s
          python3 -c 'open("s/s.cs","w").write("namespace UnityEngine { public class Object {} public class Component : Object {} public class Behaviour : Component {} public class MonoBehaviour : Behaviour {} }")'
          python3 -c 'open("s/UnityEngine.csproj","w").write("<Project Sdk=\"Microsoft.NET.Sdk\"><PropertyGroup><TargetFramework>net472</TargetFramework></PropertyGroup></Project>")'
          dotnet build s/UnityEngine.csproj -c Release -o .
          dotnet build DebtMod.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: DebtMod
          path: bin/Release/net472/DebtMod.dll
          
